
name: Hourly Activity Logger

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Python script
        run: python3 update.py

      - name: Commit and push changes
        run: |
          git config user.name "Syedbilal04"
          git config user.email "syedinaam01@gmail.com"

          git add activity.txt
          git diff --cached --quiet && exit 0

          git commit -m "Update hourly activity log"
          git push



